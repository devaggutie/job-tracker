name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: jobtracker_ci
      DB_USER: jobtracker
      DB_PASSWORD: jobtracker
      SESSION_SECURE: '0'
      TEST_BASE_URL: http://127.0.0.1:8081
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: jobtracker_ci
          MYSQL_USER: jobtracker
          MYSQL_PASSWORD: jobtracker
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Lint (php -l)
        run: find api -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --working-dir api

      - name: Run migrations
        run: php api/bin/migrate.php

      - name: Start API (php built-in server)
        run: |
          php -S 127.0.0.1:8081 -t api/public api/public/index.php > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            if php -r 'exit(@file_get_contents("http://127.0.0.1:8081/health") === false ? 1 : 0);'; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API failed to start"
          cat /tmp/php-server.log
          exit 1

      - name: Run tests
        working-directory: api
        run: ./vendor/bin/phpunit

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
